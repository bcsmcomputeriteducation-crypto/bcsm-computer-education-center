<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCSM Password Reset</title>
<style>body{font-family:Arial,sans-serif;background:#f2f5fa;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:white;padding:28px;border-radius:16px;box-shadow:0 8px 32px #18243a18;width:min(92vw,430px)}h1{font-size:24px;color:#1b3760}label{display:block;margin:16px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbc6d5;border-radius:8px}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:#1b3760;color:white;font-weight:bold;cursor:pointer}#msg{margin-top:14px;color:#9a2b2b;white-space:pre-wrap}</style></head>
<body><main class="card"><h1>BCSM Password Reset</h1><p id="roleText">Reset link verify ho raha hai…</p><form id="form"><label>Naya password (kam se kam 10 characters)</label><input id="p1" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><label>Naya password dobara likhein</label><input id="p2" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><button type="submit">Password Reset Karein</button></form><p id="msg"></p></main>
<script>
const API='https://us-central1-bcsm-computer-education-center.cloudfunctions.net/roleAuth';
const params=new URLSearchParams(location.search),role=params.get('role'),token=params.get('token');
const labels={admin:'Admin',instituteAdmin:'Institute Admin',teacher:'Teacher'};
document.getElementById('roleText').textContent=labels[role]&&token?labels[role]+' ka password reset karein. Is link se sirf isi role ka password badlega.':'Reset link adhura hai ya invalid hai.';
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('p1').value,b=document.getElementById('p2').value,msg=document.getElementById('msg');if(!labels[role]||!token){msg.textContent='Reset link valid nahi hai.';return}if(a!==b){msg.textContent='Dono password ek jaise hone chahiye.';return}if(a.length<10){msg.textContent='Password kam se kam 10 characters ka rakhein.';return}msg.textContent='Password update ho raha hai…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'completeReset',role,token,newPassword:a})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Reset fail hua.');msg.style.color='#167447';msg.textContent=labels[role]+' ka password update ho gaya. Ab login kar sakte hain.';document.getElementById('form').reset()}catch(err){msg.textContent=err.message||'Reset fail hua.'}});
</script></body></html>
